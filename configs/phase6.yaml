# Reproducible Phase 6 state-information and seat-robustness experiment.
experiment: phase6-state-info
players: 3
seeds: [7, 17, 27]
env:
  reward: sparse_win
  learner_id: 0
training:
  algorithm: ppo
  device: cpu
  hidden_size: 128
  rollout_steps: 1024
  updates: 50
  epochs: 4
  minibatch_size: 64
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  value_coefficient: 0.5
  entropy_coefficient: 0.01
  max_grad_norm: 0.5
opponents:
  training: [random, threshold, risk, ev, dp]
conditions:
  - name: basic_fixed
    observation: basic
    learner_seat_mode: fixed
  - name: basic_random
    observation: basic
    learner_seat_mode: random
  - name: competitive_fixed
    observation: competitive
    learner_seat_mode: fixed
  - name: competitive_random
    observation: competitive
    learner_seat_mode: random
  - name: deck_aware_fixed
    observation: deck_aware
    learner_seat_mode: fixed
  - name: deck_aware_random
    observation: deck_aware
    learner_seat_mode: random
evaluation:
  games_per_seat: 100
  seed_bases: [10000, 11000, 12000]
  matchups:
    - [random, threshold]
    - [risk, ev]
    - [dp, threshold]
phase5_reference:
  pooled_win_share: 0.337
  seat_spread: 0.404
  minimum_improvement: 0.05
  maximum_spread_ratio: 0.75
