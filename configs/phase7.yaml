# Reproducible Phase 7 population self-play and tournament experiment.
experiment: phase7-self-play
players: 3
seeds: [7, 17, 27]
env:
  observation: basic
  reward: sparse_win
  learner_id: 0
  learner_seat_mode: random
training:
  algorithm: ppo
  device: cpu
  hidden_size: 128
  rollout_steps: 1024
  updates: 50
  epochs: 4
  minibatch_size: 64
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  value_coefficient: 0.5
  entropy_coefficient: 0.01
  max_grad_norm: 0.5
opponents:
  training: [random, threshold, risk, ev, dp]
conditions:
  - name: baseline_control
    trainer: ppo
  - name: league_mixed
    trainer: league
    population:
      warmup_updates: 10
      snapshot_interval: 5
      max_snapshots: 8
      learned_opponent_probability: 0.5
      baseline_observation: deck_aware
  - name: latest_only
    trainer: league
    population:
      warmup_updates: 10
      snapshot_interval: 5
      max_snapshots: 1
      learned_opponent_probability: 0.5
      baseline_observation: deck_aware
evaluation:
  games_per_seat: 100
  seed_bases: [10000, 11000, 12000]
  heldout_seed_bases: [13000, 14000]
  matchups:
    - [random, threshold]
    - [risk, ev]
    - [dp, threshold]
  heldout_matchups:
    - [threshold_high, risk_strict]
    - [ev_penalized, dp_reduced]
tournament:
  games_per_lineup: 1
  seed: 20000
  initial_rating: 1500.0
  k_factor: 32.0
phase6_reference:
  pooled_win_share: 0.654
  seat_spread: 0.027
